<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark Abundance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Shark Abundance Extraction Pipeline</h1>
        
        <div class="video-section">
            <div class="video-wrapper">
                <video id="sharkVideo" src="tracked_sharks.mp4" controls width="800" preload="auto"></video>
            </div>
        </div>

        <div class="controls">
            <h2 id="phaseTitle">Phase 1: Human Counting Challenge</h2>
            <p id="phaseDesc">Watch the video closely and try to count how many juvenile sharks you see!</p>
            <button id="actionBtn" onclick="runAIPipeline()">Run AI MaxN Model</button>
        </div>
    </div>

    <script>
        function runAIPipeline() {
            const video = document.getElementById('sharkVideo');
            const title = document.getElementById('phaseTitle');
            const desc = document.getElementById('phaseDesc');
            const btn = document.getElementById('actionBtn');

            if (!video) return;

            // 1. UI Text Content Transition
            if (title) title.innerText = "Phase 2: Automated AI MaxN Extraction";
            if (desc) desc.innerText = "YOLO11 and ByteTrack channels are rendering tracking boxes natively.";
            if (btn) btn.style.display = "none";

            // 2. Clear out any old playing streams and force-load the new target asset structure
            video.pause();
            video.src = "sharks.mp4";
            video.load(); // Forces browser to establish network pipelines to the new file before playing

            // 3. ASYNCHRONOUS PROMISE HANDLING (From your documentation examples)
            const playPromise = video.play();

            if (playPromise !== undefined) {
                playPromise
                    .then(() => {
                        console.log("Tracked video stream handshake completed. Playback started smoothly!");
                    })
                    .catch(error => {
                        console.error("Playback engine Promise was rejected:", error);
                        console.warn("Hint: If you see a 404 error above, 'tracked_sharks.mp4' is missing from your GitHub online folder.");
                    });
            }
        }
    </script>
</body>
</html>
