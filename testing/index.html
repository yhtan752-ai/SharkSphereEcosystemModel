<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark Abundance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Shark Abundance Extraction Pipeline</h1>
        
        <div class="video-section">
            <div class="video-wrapper">
                <video id="sharkVideo" src="sharks.mp4" controls width="800"></video>
            </div>
        </div>

        <div class="controls">
            <h2 id="phaseTitle">Phase 1: Human Counting Challenge</h2>
            <p id="phaseDesc">Watch the video closely and try to count how many juvenile sharks you see!</p>
            <button id="actionBtn" onclick="runAIPipeline()">Run AI MaxN Model</button>
        </div>
    </div>

    <script>
        function runAIPipeline() {
            const video = document.getElementById('sharkVideo');
            
            const title = document.getElementById('phaseTitle');
            const desc = document.getElementById('phaseDesc');
            const btn = document.getElementById('actionBtn');

            // 1. Clean presentation text swap
            if (title) title.innerText = "Phase 2: Automated AI MaxN Extraction";
            if (desc) desc.innerText = "YOLO11 and ByteTrack channels are rendering tracking boxes natively.";
            if (btn) btn.style.display = "none";

            // 2. Instantly switch the video source parameter to your smooth python output file
            if (video) {
                video.src = "tracked_sharks.mp4";
                video.currentTime = 0;
                video.play();
            }
        }
    </script>
</body>
</html>
