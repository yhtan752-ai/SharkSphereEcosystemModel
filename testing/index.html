<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark Abundance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Shark Abundance Extraction Pipeline</h1>
        
        <div class="video-section">
            <div class="video-wrapper">
                <video id="sharkVideo" src="sharks.mp4" controls width="800"></video>
            </div>
        </div>

        <div class="controls">
            <h2 id="phaseTitle">Phase 1: Human Counting Challenge</h2>
            <p id="phaseDesc">Watch the video closely and try to count how many juvenile sharks you see!</p>
            <button id="actionBtn" onclick="runAIPipeline()">Run AI MaxN Model</button>
        </div>

        <div id="analyticsDisplay" style="display: none;">
            <p style="font-weight: 700; font-size: 1.2rem; color: #38bdf8; margin-bottom: 10px;">
                ByteTrack Automated Density Vector Mapping: ACTIVE
            </p>
            <div class="metric-card">
                <h3>Overall Video MaxN Peak</h3>
                <div class="number">2</div>
            </div>
        </div>
    </div>

    <script>
        function runAIPipeline() {
            const video = document.getElementById('sharkVideo');
            
            // 1. Swap user presentation text descriptions
            document.getElementById('phaseTitle').innerText = "Phase 2: Automated AI MaxN Extraction";
            document.getElementById('phaseDesc').innerText = "YOLO11 and ByteTrack channels are rendering tracking boxes natively.";
            document.getElementById('analyticsDisplay').style.display = "block";
            document.getElementById('actionBtn').style.display = "none";

            // 2. Instantly switch the video source parameter to your smooth python output file
            video.src = "tracked_sharks.mp4";
            video.currentTime = 0;
            video.play();
        }
    </script>
</body>
</html>
