<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Ocean Research Mission | SharkSphere</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- this is an SPA (single page application). thus, all content is put here -->
  <div id="app">
    <!-- landing page -->
    <section id="landing" class="landing-page page active">
      <div class="background"></div>
      <div class="content">
        <div class="hero-text">
          <img src="assets/logos/landingtext1.png" alt="Ocean" class="hero-image hero-image-1">
          <img src="assets/logos/landingtext2.png" alt="Research" class="hero-image hero-image-2">
          <img src="assets/logos/landingtext3.png" alt="Mission" class="hero-image hero-image-3">
        </div>
        <button id="cta-button" class="cta-button">Let's Go!</button>
      </div>
    </section>

    <!-- conversation page -->
    <section id="conversation" class="page conversation-page">
      <div class="background"></div>
      <div class="conversation-content">
        <div class="avatar-character"></div>
        <div class="speech-bubbles">
          <div class="speech-bubble active">Welcome aboard, fellow scientist!</div>
          <div class="speech-bubble">Today, we are going to explore a very important species.</div>
          <div class="speech-bubble">This species helps keep coral reefs</div>
        </div>
        <button id="next-button" class="next-button">Next</button>
      </div>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
